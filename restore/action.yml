name: Restore instructor files
description: Verify the submitted workflow and JSON, then replace the listed paths before grading.
inputs:
  source-artifact-id:
    description: Immutable artifact ID from the AbstractClassroom source job.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        artifact-ids: ${{ inputs.source-artifact-id }}
        path: ${{ runner.temp }}/abstractclassroom-source
        merge-multiple: true
    - name: Verify workflow and restore the registered files
      shell: bash
      env:
        AC_RUNTIME: ${{ github.action_path }}/../scripts/runtime.py
        SOURCE_PACKAGE: ${{ runner.temp }}/abstractclassroom-source/source.json
      run: python3 -I "$AC_RUNTIME" restore
