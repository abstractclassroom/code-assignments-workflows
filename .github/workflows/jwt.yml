name: Request Grade Token
on:
  workflow_call:
    inputs:
      assignment-id:
        required: true
        type: string
      grade:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: submission
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: abstractclassroom/code-assignments-workflows
          ref: v3.0.0
          path: runtime
          persist-credentials: false
      - name: Request the API-signed Grade Token and display the score
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment-id }}
          ASSIGNMENT_GRADE: ${{ inputs.grade }}
          SUBMISSION_PATH: ${{ github.workspace }}/submission
        run: python3 -I "$GITHUB_WORKSPACE/runtime/scripts/runtime.py" receipt
